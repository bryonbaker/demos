apiVersion: v1
kind: Service
metadata:
  name: churn-ray-cluster-head-svc
  namespace: kubeflow
spec:
  selector:
    ray.io/node-type: head
    ray.io/cluster: churn-ray-cluster
  ports:
    - name: dashboard
      port: 8265
      targetPort: 8265
    - name: ray-client
      port: 10001
      targetPort: 10001
    - name: gcs
      port: 6379
      targetPort: 6379
  type: ClusterIP
